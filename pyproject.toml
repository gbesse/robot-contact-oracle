[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-contact-oracle"
version = "0.1.0"
description = "Black-box evidence for Gazebo contact response regressions."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
robot-contact-oracle = "robot_contact_oracle:main"

[tool.setuptools]
py-modules = ["robot_contact_oracle"]
